<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryo Eurofighter</title>
  <style>
    :root {
      --bg: #07080c;
      --card-bg: rgba(14, 17, 26, 0.78);
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.3);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-muted: #8b9bb4;
      --btn-bg: rgba(255, 255, 255, 0.04);
      --btn-hover: rgba(0, 240, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      /* Сюда можно подставить ссылку на свой фон: background-image: url('bg.jpg'); */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.06) 0%, transparent 45%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Верхний контейнер карточки */
    .profile-card {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    /* ЛЕВАЯ КОЛОНКА */
    .left-col {
      display: flex;
      gap: 20px;
    }

    .avatar-wrapper {
      flex-shrink: 0;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .info-wrapper {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .title {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      margin-bottom: 12px;
    }

    .bio-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--text-muted);
      height: 100%;
      min-height: 90px;
    }

    /* ПРАВАЯ КОЛОНКА (КНОПКИ) */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
      color: #fff;
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-action-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ПЛАШКА УВЕДОМЛЕНИЯ (ТОСТЕР) */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f1422;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      bottom: 30px;
      opacity: 1;
    }

    /* Адаптив для телефонов */
    @media (max-width: 768px) {
      .profile-card {
        grid-template-columns: 1fr;
        padding: 24px 18px;
        gap: 24px;
      }
      .left-col {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Левая колонка -->
    <div class="left-col">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300" alt="Avatar">
      </div>
      <div class="info-wrapper">
        <h1 class="title">Ryo Eurofighter</h1>
        <div class="bio-box">
          описание которое я когда нибудь придумаю
        </div>
      </div>
    </div>

    <!-- Правая колонка -->
    <div class="right-col">
      <a href="https://steamcommunity.com/profiles/76561199693464578/" target="_blank" class="btn" onclick="playClick()">
        <span>Стим</span>
        <span class="btn-action-hint">Перейти ↗</span>
      </a>

      <button class="btn" onclick="copyText('ryo_hell', 'Скопировано: ryo_hell')">
        <span>Дискорд</span>
        <span class="btn-action-hint">Копировать</span>
      </button>

      <button class="btn" onclick="copyText('Hell_yet', 'Скопировано: Hell_yet')">
        <span>Мой пс нетворк</span>
        <span class="btn-action-hint">Копировать</span>
      </button>

      <button class="btn" onclick="showToast('терпи')">
        <span>однажды</span>
        <span class="btn-action-hint">???</span>
      </button>
    </div>
  </div>

  <!-- Плашка всплывашки -->
  <div id="toast" class="toast"></div>

  <script>
    // Генератор механического щелчка через аудио-движок
    function playClick() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.04);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    // Показ плашки
    let toastTimeout;
    function showToast(text) {
      playClick();
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Копирование в буфер
    function copyText(text, message) {
      navigator.clipboard.writeText(text);
      showToast(message);
    }
  </script>
</body>
</html>
