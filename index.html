<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryo Eurofighter</title>
  <style>
    @font-face {
      font-family: 'NDot-57';
      src: url('https://cdn.shopify.com/s/files/1/0584/0932/0622/t/1/assets/fonts-ndot57.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #090a0c;
      --card-bg: rgba(18, 20, 24, 0.94);
      --card-inner: #14161b;
      --tile-bg: #1c1e24;
      --tile-hover: #262932;
      --nothing-red: #eb0029;
      --red-hover: #ff1a3c;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.15);
      --text: #f0f2f5;
      --text-muted: #838792;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'NDot-57', monospace, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(235, 0, 41, 0.04) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
      gap: 24px;
    }

    .main-container {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ЭТАЖ 1: ПРОФИЛЬ + СЕТКА КНОПОК */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .left-col {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    /* Аватарка в виде фирменного сквиркла Nothing */
    .avatar-wrapper {
      flex-shrink: 0;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 28px;
      object-fit: cover;
      border: 1px solid var(--border-light);
      display: block;
      background: var(--tile-bg);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .avatar:hover {
      transform: scale(1.02);
      border-color: var(--nothing-red);
    }

    .info-wrapper {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      height: 100%;
      justify-content: center;
    }

    .title {
      font-size: 1.85rem;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      color: #fff;
    }

    .bio-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-muted);
      min-height: 95px;
      letter-spacing: 0.5px;
    }

    /* СЕТКА ПЛИТОК И КАПСУЛ */
    .right-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--tile-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      background: var(--tile-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      color: #fff;
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Фирменные красные капсулы Nothing */
    .btn-red {
      background: var(--nothing-red);
      border-color: transparent;
      color: #fff;
    }

    .btn-red:hover {
      background: var(--red-hover);
      border-color: transparent;
      box-shadow: 0 0 20px rgba(235, 0, 41, 0.45);
      color: #fff;
    }

    .btn-red .btn-action-hint {
      color: rgba(255, 255, 255, 0.8);
    }

    .btn-action-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* ЭТАЖ 2: ПЛЕЕР + ИГРЫ */
    .bottom-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    .sub-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8);
    }

    /* ПЛЕЕР */
    .player-layout {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .player-cover {
      width: 95px;
      height: 95px;
      border-radius: 20px;
      object-fit: cover;
      border: 1px solid var(--border-light);
      background: var(--tile-bg);
      flex-shrink: 0;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 8px;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--nothing-red);
      letter-spacing: 2px;
    }

    .track-title {
      font-size: 1.15rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      letter-spacing: 1px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--nothing-red);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .ctrl-btn-group {
      display: flex;
      gap: 8px;
    }

    .ctrl-btn {
      background: var(--tile-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 12px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: var(--tile-hover);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-icon {
      font-size: 0.8rem;
      color: var(--text-muted);
      user-select: none;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 65px;
      height: 4px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--nothing-red);
      cursor: pointer;
    }

    .time-stamp {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* ИГРЫ */
    .games-card h3 {
      font-size: 0.95rem;
      color: var(--nothing-red);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .platform-col h4 {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .game-badge {
      display: block;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text);
      transition: border-color 0.2s;
    }

    .game-badge:hover {
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* СЧЁТЧИК ПОСЕЩЕНИЙ */
    .visitor-badge {
      position: fixed;
      bottom: 16px;
      right: 20px;
      background: rgba(18, 20, 24, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
      z-index: 90;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--nothing-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--nothing-red);
      animation: pulseDot 2.2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .visitor-count {
      color: #fff;
    }

    /* ТОСТЕР */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #181a20;
      border: 1px solid var(--nothing-red);
      color: #fff;
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 0.95rem;
      letter-spacing: 1px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: all 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      bottom: 30px;
      opacity: 1;
    }

    @media (max-width: 950px) {
      .profile-card, .bottom-row {
        grid-template-columns: 1fr;
        padding: 24px;
        gap: 20px;
      }
    }

    @media (max-width: 550px) {
      .left-col {
        flex-direction: column;
        text-align: center;
      }
      .right-col {
        grid-template-columns: 1fr;
      }
      .player-layout {
        flex-direction: column;
        text-align: center;
      }
      .track-title {
        max-width: 100%;
      }
      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- Верхний этаж -->
    <div class="profile-card">
      <div class="left-col">
        <div class="avatar-wrapper">
          <img class="avatar" src="avatar.jpg" onerror="this.onerror=null; this.src='avatar.png';" alt="Avatar">
        </div>

        <div class="info-wrapper">
          <h1 class="title">Ryo Eurofighter</h1>
          <div class="bio-box">
            description coming soon...
          </div>
        </div>
      </div>

      <div class="right-col">
        <a href="https://steamcommunity.com/profiles/76561199693464578/" target="_blank" class="btn" onclick="playHaptic()">
          <span>STEAM</span>
          <span class="btn-action-hint">OPEN ↗</span>
        </a>

        <!-- Фирменная красная капсула -->
        <a href="https://www.tiktok.com/@hell_yet" target="_blank" class="btn btn-red" onclick="playHaptic()">
          <span>TIKTOK</span>
          <span class="btn-action-hint">OPEN ↗</span>
        </a>

        <button class="btn" onclick="copyText('ryo_hell', 'COPIED: ryo_hell')">
          <span>DISCORD</span>
          <span class="btn-action-hint">COPY</span>
        </button>

        <!-- Фирменная красная капсула -->
        <a href="https://www.donationalerts.com/r/hell_yet" target="_blank" class="btn btn-red" onclick="playHaptic()">
          <span>DONATIONALERTS</span>
          <span class="btn-action-hint">OPEN ↗</span>
        </a>

        <button class="btn" onclick="copyText('Hell_yet', 'COPIED: Hell_yet')">
          <span>PSN</span>
          <span class="btn-action-hint">COPY</span>
        </button>

        <button class="btn" onclick="playFlyby()">
          <span>FLYBY SOUND</span>
          <span class="btn-action-hint">AUDIO ▶</span>
        </button>

        <button class="btn" onclick="showToast('терпи')">
          <span>SOMEDAY</span>
          <span class="btn-action-hint">???</span>
        </button>

        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="btn" onclick="playHaptic()">
          <span>FREE ROBUX ⚡</span>
          <span class="btn-action-hint">CLAIM ↗</span>
        </a>
      </div>
    </div>

    <!-- Нижний этаж -->
    <div class="bottom-row">
      <!-- Плеер -->
      <div class="sub-card">
        <div class="player-layout">
          <img id="track-cover" class="player-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="Cover">
          <div class="player-details">
            <div id="track-artist" class="track-artist">ARTIST</div>
            <div id="track-title" class="track-title">TITLE</div>
            
            <div class="progress-container" id="progress-container" onclick="seek(event)">
              <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="player-controls">
              <div class="ctrl-btn-group">
                <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
                <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
              </div>

              <div class="volume-group">
                <span class="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.3" oninput="setVolume(this.value)">
              </div>

              <span id="time-display" class="time-stamp">0:00 / 0:00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Игры -->
      <div class="sub-card games-card">
        <h3>DISCIPLINES // GAMES</h3>
        <div class="games-grid">
          <div class="platform-col">
            <h4>ON PS4</h4>
            <div class="game-badge">War Thunder</div>
            <div class="game-badge">Fortnite</div>
            <div class="game-badge">GTA Online</div>
          </div>
          <div class="platform-col">
            <h4>ON MOBILE</h4>
            <div class="game-badge">Genshin Impact</div>
            <div class="game-badge">Brawl Stars</div>
            <div class="game-badge">Clash Royale</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Виджет счётчика -->
  <div class="visitor-badge">
    <div class="live-dot"></div>
    <span>SIGNALS // <span id="visit-count" class="visitor-count">...</span></span>
  </div>

  <audio id="audio"></audio>
  <div id="toast" class="toast"></div>

  <script>
    const playlist = [
      {
        artist: "LAZZY2WICE",
        title: "YUNGCREW",
        src: "LAZZY2WICE - YUNGCREW.mp3",
        cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200"
      },
      {
        artist: "LAZZY2WICE",
        title: "Дискеты",
        src: "LAZZY2WICE - Дискеты.mp3",
        cover: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=200"
      },
      {
        artist: "LAZZY2WICE",
        title: "WESTERN",
        src: "Y2mate.mx - LAZZY2WICE - WESTERN (320 kbps).mp3",
        cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=200"
      }
    ];

    let currentTrackIdx = 0;
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const trackArtist = document.getElementById('track-artist');
    const trackTitle = document.getElementById('track-title');
    const trackCover = document.getElementById('track-cover');
    const progressBar = document.getElementById('progress-bar');
    const timeDisplay = document.getElementById('time-display');

    audio.volume = 0.3;

    function setVolume(val) {
      audio.volume = parseFloat(val);
    }

    function loadTrack(idx) {
      const track = playlist[idx];
      audio.src = track.src;
      trackArtist.innerText = track.artist;
      trackTitle.innerText = track.title;
      trackCover.src = track.cover;
      progressBar.style.width = '0%';
      timeDisplay.innerText = '0:00 / 0:00';
    }

    loadTrack(currentTrackIdx);

    function togglePlay() {
      playHaptic();
      if (audio.paused) {
        audio.play().catch(() => {});
        playBtn.innerText = '⏸';
      } else {
        audio.pause();
        playBtn.innerText = '▶';
      }
    }

    function prevTrack() {
      playHaptic();
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIdx);
      audio.play().catch(() => {});
      playBtn.innerText = '⏸';
    }

    function nextTrack() {
      playHaptic();
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      loadTrack(currentTrackIdx);
      audio.play().catch(() => {});
      playBtn.innerText = '⏸';
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        timeDisplay.innerText = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', nextTrack);

    function seek(e) {
      const rect = document.getElementById('progress-container').getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = pos * audio.duration;
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    fetch('https://api.counterapi.dev/v1/ryo_eurofighter_page/visits/up')
      .then(res => res.json())
      .then(data => {
        const count = String(data.count).padStart(4, '0');
        document.getElementById('visit-count').innerText = count;
      })
      .catch(() => {
        document.getElementById('visit-count').innerText = '0001';
      });

    // Аутентичный глухой хаптик-щелчок Nothing OS
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playHaptic() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.035);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.035);
      } catch (e) {}
    }

    function playFlyby() {
      try {
        const ctx = getAudioCtx();
        const dur = 2.4;
        const now = ctx.currentTime;
        const bufferSize = ctx.sampleRate * dur;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 3.2;
        filter.frequency.setValueAtTime(380, now);
        filter.frequency.exponentialRampToValueAtTime(1600, now + 0.9);
        filter.frequency.exponentialRampToValueAtTime(220, now + 2.3);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.005, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.9);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start(now);
        noise.stop(now + dur);
      } catch (e) {}
    }

    let toastTimeout;
    function showToast(text) {
      playHaptic();
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function copyText(text, message) {
      navigator.clipboard.writeText(text);
      showToast(message);
    }
  </script>
</body>
</html>
