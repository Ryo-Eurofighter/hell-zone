<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryo Eurofighter</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(13, 17, 24, 0.85);
      --card-inner: rgba(0, 0, 0, 0.35);
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.28);
      --glyph-glow: rgba(255, 255, 255, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-muted: #7e8c9f;
      --btn-bg: rgba(255, 255, 255, 0.035);
      --btn-hover: rgba(0, 240, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.05) 0%, transparent 40%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 24px;
    }

    .main-container {
      width: 100%;
      max-width: 1060px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ЭТАЖ 1: ПРОФИЛЬ + СЕТКА 2x4 */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 36px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .left-col {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    /* АВАТАРКА И ГЛИФЫ NOTHING PHONE (3A) */
    .avatar-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .glyph-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 160px;
      height: 160px;
      pointer-events: none;
      filter: drop-shadow(0 0 8px var(--glyph-glow));
      animation: glyphBlink 4s infinite ease-in-out;
      z-index: 1;
    }

    .avatar-container:hover .glyph-svg {
      filter: drop-shadow(0 0 15px #fff);
      animation: none;
      opacity: 1;
    }

    .avatar {
      width: 98px;
      height: 98px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      z-index: 2;
      transition: transform 0.3s ease;
      background: #11141e;
    }

    .avatar-container:hover .avatar {
      transform: scale(1.02);
    }

    @keyframes glyphBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
      55% { opacity: 1; }
      60% { opacity: 0.4; }
    }

    .info-wrapper {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      height: 100%;
      justify-content: center;
    }

    .title {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: #fff;
    }

    .bio-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text-muted);
      min-height: 100px;
    }

    /* КНОПКИ СЕТКИ 2x4 */
    .right-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      transform: translateY(-2px);
      color: #fff;
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-action-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      opacity: 0.75;
    }

    /* ЭТАЖ 2: ПЛЕЕР + ИГРЫ */
    .bottom-row {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
    }

    .sub-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    /* ПЛЕЕР */
    .player-layout {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .player-cover {
      width: 95px;
      height: 95px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #10141f;
      flex-shrink: 0;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 8px;
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .ctrl-btn-group {
      display: flex;
      gap: 8px;
    }

    .ctrl-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* РЕГУЛЯТОР ГРОМКОСТИ */
    .volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-icon {
      font-size: 0.75rem;
      color: var(--text-muted);
      user-select: none;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 65px;
      height: 4px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      cursor: pointer;
    }

    .time-stamp {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* БЛОК ИГР */
    .games-card h3 {
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .platform-col h4 {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .game-badge {
      display: block;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
      transition: border-color 0.2s;
    }

    .game-badge:hover {
      border-color: var(--accent);
    }

    /* ТОСТЕР */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d121c;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 26px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 15px var(--accent-glow);
      opacity: 0;
      transition: all 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      bottom: 30px;
      opacity: 1;
    }

    /* АДАПТИВ */
    @media (max-width: 950px) {
      .profile-card, .bottom-row {
        grid-template-columns: 1fr;
        padding: 24px;
        gap: 20px;
      }
    }

    @media (max-width: 550px) {
      .left-col {
        flex-direction: column;
        text-align: center;
      }
      .right-col {
        grid-template-columns: 1fr;
      }
      .player-layout {
        flex-direction: column;
        text-align: center;
      }
      .track-title {
        max-width: 100%;
      }
      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- Верхний этаж -->
    <div class="profile-card">
      <div class="left-col">
               <div class="avatar-container">
          <svg class="glyph-svg" viewBox="0 0 160 160">
            <!-- 1. Верхняя левая дуга (R=60, от 135° до 235°) -->
            <path d="M 37.6 37.6 A 60 60 0 0 1 114.4 30.6" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
            
            <!-- 2. Нижняя диагональная палочка (отодвинута от круга под 45°) -->
            <path d="M 28 132 L 40 120" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
            
            <!-- 3. Правая вертикальная дуга (R=60, от -35° до 35°) -->
            <path d="M 129.1 45.6 A 60 60 0 0 1 129.1 114.4" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
          </svg>

          <img class="avatar" src="avatar.jpg" onerror="this.onerror=null; this.src='avatar.png';" alt="Avatar">
        </div>

        <div class="info-wrapper">
          <h1 class="title">Ryo Eurofighter</h1>
          <div class="bio-box">
            description coming soon...
          </div>
        </div>
      </div>

      <div class="right-col">
        <a href="https://steamcommunity.com/profiles/76561199693464578/" target="_blank" class="btn" onclick="playClick()">
          <span>STEAM</span>
          <span class="btn-action-hint">OPEN ↗</span>
        </a>

        <a href="https://www.tiktok.com/@hell_yet" target="_blank" class="btn" onclick="playClick()">
          <span>TIKTOK</span>
          <span class="btn-action-hint">OPEN ↗</span>
        </a>

        <button class="btn" onclick="copyText('ryo_hell', 'COPIED: ryo_hell')">
          <span>DISCORD</span>
          <span class="btn-action-hint">COPY</span>
        </button>

        <a href="https://www.donationalerts.com/r/hell_yet" target="_blank" class="btn" onclick="playClick()">
          <span>DONATIONALERTS</span>
          <span class="btn-action-hint">OPEN ↗</span>
        </a>

        <button class="btn" onclick="copyText('Hell_yet', 'COPIED: Hell_yet')">
          <span>PSN</span>
          <span class="btn-action-hint">COPY</span>
        </button>

        <button class="btn" onclick="playFlyby()">
          <span>FLYBY SOUND</span>
          <span class="btn-action-hint">AUDIO ▶</span>
        </button>

        <button class="btn" onclick="showToast('терпи')">
          <span>SOMEDAY</span>
          <span class="btn-action-hint">???</span>
        </button>

        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="btn" onclick="playClick()">
          <span>FREE ROBUX ⚡</span>
          <span class="btn-action-hint">CLAIM ↗</span>
        </a>
      </div>
    </div>

    <!-- Нижний этаж -->
    <div class="bottom-row">
      <!-- Плеер -->
      <div class="sub-card">
        <div class="player-layout">
          <img id="track-cover" class="player-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="Cover">
          <div class="player-details">
            <div id="track-artist" class="track-artist">ARTIST</div>
            <div id="track-title" class="track-title">TITLE</div>
            
            <div class="progress-container" id="progress-container" onclick="seek(event)">
              <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="player-controls">
              <div class="ctrl-btn-group">
                <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
                <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
              </div>

              <!-- Ползунок громкости -->
              <div class="volume-group">
                <span class="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.3" oninput="setVolume(this.value)">
              </div>

              <span id="time-display" class="time-stamp">0:00 / 0:00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Игры -->
      <div class="sub-card games-card">
        <h3>DISCIPLINES // GAMES</h3>
        <div class="games-grid">
          <div class="platform-col">
            <h4>ON PS4</h4>
            <div class="game-badge">War Thunder</div>
            <div class="game-badge">Fortnite</div>
            <div class="game-badge">GTA Online</div>
          </div>
          <div class="platform-col">
            <h4>ON MOBILE</h4>
            <div class="game-badge">Genshin Impact</div>
            <div class="game-badge">Brawl Stars</div>
            <div class="game-badge">Clash Royale</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <audio id="audio"></audio>
  <div id="toast" class="toast"></div>

  <script>
    const playlist = [
      {
        artist: "LAZZY2WICE",
        title: "YUNGCREW",
        src: "LAZZY2WICE - YUNGCREW.mp3",
        cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200"
      },
      {
        artist: "LAZZY2WICE",
        title: "Дискеты",
        src: "LAZZY2WICE - Дискеты.mp3",
        cover: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=200"
      },
      {
        artist: "LAZZY2WICE",
        title: "WESTERN",
        src: "Y2mate.mx - LAZZY2WICE - WESTERN (320 kbps).mp3",
        cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=200"
      }
    ];

    let currentTrackIdx = 0;
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const trackArtist = document.getElementById('track-artist');
    const trackTitle = document.getElementById('track-title');
    const trackCover = document.getElementById('track-cover');
    const progressBar = document.getElementById('progress-bar');
    const timeDisplay = document.getElementById('time-display');

    // Безопасная комфортная громкость 30%
    audio.volume = 0.3;

    function setVolume(val) {
      audio.volume = parseFloat(val);
    }

    function loadTrack(idx) {
      const track = playlist[idx];
      audio.src = track.src;
      trackArtist.innerText = track.artist;
      trackTitle.innerText = track.title;
      trackCover.src = track.cover;
      progressBar.style.width = '0%';
      timeDisplay.innerText = '0:00 / 0:00';
    }

    loadTrack(currentTrackIdx);

    function togglePlay() {
      playClick();
      if (audio.paused) {
        audio.play().catch(() => {});
        playBtn.innerText = '⏸';
      } else {
        audio.pause();
        playBtn.innerText = '▶';
      }
    }

    function prevTrack() {
      playClick();
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIdx);
      audio.play().catch(() => {});
      playBtn.innerText = '⏸';
    }

    function nextTrack() {
      playClick();
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      loadTrack(currentTrackIdx);
      audio.play().catch(() => {});
      playBtn.innerText = '⏸';
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        timeDisplay.innerText = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', nextTrack);

    function seek(e) {
      const rect = document.getElementById('progress-container').getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = pos * audio.duration;
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playClick() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    function playFlyby() {
      try {
        const ctx = getAudioCtx();
        const dur = 2.4;
        const now = ctx.currentTime;

        const bufferSize = ctx.sampleRate * dur;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 3.2;
        filter.frequency.setValueAtTime(380, now);
        filter.frequency.exponentialRampToValueAtTime(1600, now + 0.9);
        filter.frequency.exponentialRampToValueAtTime(220, now + 2.3);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.005, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.9);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start(now);
        noise.stop(now + dur);
      } catch (e) {}
    }

    let toastTimeout;
    function showToast(text) {
      playClick();
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function copyText(text, message) {
      navigator.clipboard.writeText(text);
      showToast(message);
    }
  </script>
</body>
</html>
