<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile // ID Card</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 22, 34, 0.75);
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.35);
      --text: #e2e8f0;
      --text-muted: #8492a6;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(120, 0, 255, 0.08) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 35px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .status-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 14px;
      height: 14px;
      background: #00ff66;
      border-radius: 50%;
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px #00ff66;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 0.92rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-link:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
      color: #fff;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #555e70;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <!-- Замени ссылку на свою аватарку -->
      <img class="avatar" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300" alt="Avatar">
      <div class="status-badge" title="Online"></div>
    </div>

    <!-- Твой ник или имя -->
    <h1 class="name">Твой Ник</h1>
    <div class="tagline">// Operator //</div>
    <p class="bio">Короткое описание о себе, текущий статус, пара слов про увлечения или просто девиз.</p>

    <!-- Твои ссылки -->
    <div class="links">
      <a href="https://t.me/" target="_blank" class="btn-link">Telegram</a>
      <a href="https://discord.com/" target="_blank" class="btn-link">Discord</a>
      <a href="https://steamcommunity.com/" target="_blank" class="btn-link">Steam</a>
      <a href="https://github.com/" target="_blank" class="btn-link">GitHub</a>
    </div>

    <div class="footer-note">SYSTEM ONLINE</div>
  </div>

</body>
</html>
